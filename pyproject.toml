[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlang-prototype"
version = "0.1.0"
description = "Compile compact data-processing pipelines into standalone Python"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
bench = ["tiktoken==0.12.0"]

[project.scripts]
agentlang = "agentlang.__main__:main"

[tool.setuptools]
packages = ["agentlang"]
